<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="OkamiCoder">
<meta name="description" content="AnyPlay — современный веб-плеер для вашей музыки">
<title>AnyPlay</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

<header class="fixed top-0 left-0 right-0 z-40 backdrop-blur-xl">
  <div class="max-w-[1600px] mx-auto px-6 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-500 to-fuchsia-600 flex items-center justify-center shadow-lg shadow-violet-500/30">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M9 18V6l12-2v12.5a3.5 3.5 0 1 1-2-3.16V7.4L11 9v9.5A3.5 3.5 0 1 1 9 15.34V18z"/></svg>
      </div>
      <h1 class="font-display text-lg font-extrabold tracking-[.12em] uppercase bg-gradient-to-r from-violet-300 via-fuchsia-400 to-violet-300 bg-clip-text text-transparent">AnyPlay</h1>
    </div>
    <div class="flex items-center gap-3">
      <input type="file" id="fileInput" accept="audio/*" multiple class="hidden">
      <button id="addToPlaylistBtn" class="hidden px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm font-medium transition-all hover:scale-105 active:scale-95">
        + В плейлист
      </button>
      <button id="uploadBtn" class="px-5 py-2 rounded-xl bg-gradient-to-r from-violet-500 to-fuchsia-600 hover:from-violet-400 hover:to-fuchsia-500 text-sm font-bold shadow-lg shadow-violet-500/30 transition-all hover:scale-105 active:scale-95 flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"/></svg>
        Загрузить музыку
      </button>
    </div>
  </div>
</header>

<main class="flex-1 max-w-[1600px] w-full mx-auto px-6 pt-24 pb-48 flex gap-6">

  <aside class="w-72 shrink-0 hidden lg:block">
    <div class="glass-card gradient-border rounded-3xl p-4 sticky top-24">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-slate-300">Плейлисты</h2>
        <button id="newPlaylistBtn" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-violet-600 flex items-center justify-center transition-all hover:rotate-90 duration-300" title="Создать плейлист">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
        </button>
      </div>
      <button id="allTracksBtn" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-slate-800 transition-colors flex items-center gap-3 mb-1 bg-slate-800/60 border border-slate-700" data-view="all">
        <svg class="w-4 h-4 text-violet-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
        <span class="text-sm font-medium">Все треки</span>
        <span id="allCount" class="ml-auto text-xs text-slate-500">0</span>
      </button>
      <div id="playlistList" class="space-y-1 max-h-[50vh] overflow-y-auto pr-1"></div>
    </div>
  </aside>

  <section class="flex-1 min-w-0">
    <div class="flex items-end justify-between mb-6">
      <div>
        <h2 id="viewTitle" class="font-display text-4xl font-extrabold tracking-wide">Все треки</h2>
        <p id="viewSubtitle" class="text-slate-500 text-sm mt-1">Загрузите файлы, чтобы начать</p>
      </div>
      <button id="playAllBtn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-violet-600 border border-slate-700 text-sm font-medium transition-all hover:scale-105 active:scale-95 flex items-center gap-2">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg>
        Играть всё
      </button>
    </div>
    <div id="trackList" class="space-y-1"></div>
    <div id="emptyState" class="glass-card gradient-border rounded-3xl flex flex-col items-center justify-center py-24 px-8 text-center max-w-lg mx-auto">
      <div class="w-24 h-24 rounded-3xl bg-gradient-to-br from-violet-600/40 to-fuchsia-600/40 border border-violet-500/40 flex items-center justify-center mb-6 animate-float shadow-2xl shadow-violet-500/30">
        <svg class="w-10 h-10 text-violet-400" fill="currentColor" viewBox="0 0 24 24"><path d="M9 18V6l12-2v12.5a3.5 3.5 0 1 1-2-3.16V7.4L11 9v9.5A3.5 3.5 0 1 1 9 15.34V18z"/></svg>
      </div>
      <h3 class="text-xl font-bold mb-2">Здесь пока пусто</h3>
      <p class="text-slate-500 text-sm max-w-xs">Загрузите аудиофайлы с устройства — они сразу начнут играть</p>
    </div>
  </section>
</main>

<div id="player" class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-2xl border-t border-slate-800 translate-y-full transition-transform duration-500 ease-out">
  <div class="h-1 bg-slate-800 group cursor-pointer" id="progressWrap">
    <div id="progressBuffered" class="h-full bg-slate-700 w-0"></div>
    <div id="progressFill" class="h-full bg-gradient-to-r from-violet-500 to-fuchsia-500 -mt-1 w-0 relative transition-none">
      <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-white opacity-0 group-hover:opacity-100 transition-opacity shadow-lg"></div>
    </div>
  </div>
  <div class="max-w-[1600px] mx-auto px-6 py-3 flex items-center gap-6">
    <div class="flex items-center gap-3 w-64 min-w-0">
      <div id="cover" class="w-14 h-14 rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-700 flex items-center justify-center shrink-0 shadow-lg shadow-violet-500/20">
        <svg class="w-6 h-6 text-white/90" fill="currentColor" viewBox="0 0 24 24"><path d="M9 18V6l12-2v12.5a3.5 3.5 0 1 1-2-3.16V7.4L11 9v9.5A3.5 3.5 0 1 1 9 15.34V18z"/></svg>
      </div>
      <div class="min-w-0">
        <div id="trackTitle" class="font-semibold text-sm truncate">—</div>
        <div id="trackArtist" class="text-xs text-slate-500 truncate">—</div>
      </div>
      <button id="likeBtn" class="ml-1 text-slate-500 hover:text-fuchsia-400 transition-colors shrink-0" title="В избранное">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
      </button>
    </div>

    <div class="flex-1 flex flex-col items-center gap-1.5">
      <div class="flex items-center gap-4">
        <button id="shuffleBtn" class="text-slate-500 hover:text-white transition-colors" title="Перемешать">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"/></svg>
        </button>
        <button id="prevBtn" class="text-slate-300 hover:text-white transition-transform hover:scale-110 active:scale-95" title="Назад">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button id="playBtn" class="w-12 h-12 rounded-full bg-white text-slate-950 flex items-center justify-center shadow-lg shadow-white/10 transition-all hover:scale-110 active:scale-95" title="Играть / Пауза">
          <svg id="playIcon" class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg>
          <svg id="pauseIcon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button id="nextBtn" class="text-slate-300 hover:text-white transition-transform hover:scale-110 active:scale-95" title="Вперёд">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6v12z"/></svg>
        </button>
        <button id="repeatBtn" class="text-slate-500 hover:text-white transition-colors relative" title="Повтор">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
          <span id="repeatBadge" class="hidden absolute -top-1 -right-1 w-3 h-3 rounded-full bg-fuchsia-500 text-[8px] flex items-center justify-center font-bold">1</span>
        </button>
      </div>
      <div class="flex items-center gap-2 w-full max-w-xl text-[11px] text-slate-500 font-mono">
        <span id="currentTime">0:00</span>
        <input type="range" id="seekBar" min="0" max="1000" value="0" class="flex-1 seek">
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="w-64 flex items-center justify-end gap-3">
      <button id="muteBtn" class="text-slate-400 hover:text-white transition-colors" title="Звук">
        <svg id="volIcon" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.05A4.47 4.47 0 0 0 16.5 12z"/></svg>
        <svg id="muteIcon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.6 2 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4-2.7-2.7z"/></svg>
      </button>
      <input type="range" id="volumeBar" min="0" max="100" value="80" class="w-24 volume">
    </div>
  </div>
</div>

<div id="playlistModal" class="hidden fixed inset-0 z-[60] items-center justify-center bg-slate-950/70 backdrop-blur-sm p-4">
  <div class="glass-card gradient-border rounded-3xl p-6 w-full max-w-sm shadow-2xl animate-pop">
    <h3 class="font-display text-lg font-bold mb-4">Новый плейлист</h3>
    <input type="text" id="playlistNameInput" placeholder="Название плейлиста" maxlength="40" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 focus:border-violet-500 outline-none text-sm mb-4 transition-colors">
    <div class="flex gap-3">
      <button id="cancelPlaylistBtn" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-medium transition-colors">Отмена</button>
      <button id="createPlaylistBtn" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-violet-500 to-fuchsia-600 hover:from-violet-400 hover:to-fuchsia-500 text-sm font-bold transition-all active:scale-95">Создать</button>
    </div>
  </div>
</div>

<div id="toast" class="fixed top-20 right-6 z-[70] px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 shadow-2xl text-sm font-medium opacity-0 translate-x-6 transition-all duration-300 pointer-events-none max-w-xs"></div>

<audio id="audio" preload="metadata"></audio>
<script src="script.js"></script>
</body>
</html>
